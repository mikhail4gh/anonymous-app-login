<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="whole-container">
        <div class="small-container">
            <h1 class="login-text">Login</h1>
            <div class="input-container">
                <input type="email" placeholder="Enter your email" class="input">
                <input type="password" placeholder="Enter your password" class="input">
            </div>
            <div class="backup-access">
                <span class="checkbox"><input type="checkbox" checked> Remember me</span>
                <span class="password">Forgot password?</span>
            </div>
            <div class="alternate-login-container">
                <button class="login-button">Log in</button>
                <p class="register">Don't have an account? Register</p>
            </div>

        </div>
         
    </div>
</body>
</html>
